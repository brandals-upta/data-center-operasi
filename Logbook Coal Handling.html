<title>Logbook Harian Coal Handling</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#E9EFF7;--card:#FFFFFF;--soft:#F3F7FC;--navy:#0B2752;--navy2:#123E7C;--accent:#1667D9;--malam:#4B5563;--pagi:#F4B400;--sore:#EF6A2C;--op:#17A34A;--sb:#E8A400;--tsb:#D92D20;--pm:#7C3AED;--fd:"Barlow Semi Condensed","Arial Narrow",Arial,sans-serif;--fb:"Barlow",system-ui,"Segoe UI",Arial,sans-serif;color-scheme:light}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{color:var(--ink);font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.pad{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.hdr{background:linear-gradient(100deg,var(--navy),#0F3A78 60%,#0B2752);color:#fff;padding-block:10px}
.hin{display:flex;align-items:center;gap:16px;flex-wrap:wrap;max-width:1720px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;padding-right:16px;border-right:1px solid rgba(255,255,255,.25)}
.brand img{width:38px;height:38px;border-radius:3px}
.brand b{display:block;font:700 22px/1 var(--fd);letter-spacing:.06em}
.brand span{font:500 14px/1.1 var(--fb)}
.ttl h1{margin:0;font:700 clamp(18px,2vw,26px)/1.05 var(--fd);letter-spacing:.02em;text-wrap:balance}
.ttl p{margin:2px 0 0;font:600 12.5px var(--fd);letter-spacing:.08em;opacity:.85}
.hr{margin-left:auto;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.hbox{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);border-radius:8px;padding:5px 10px;min-height:44px}
.hbox svg{width:22px;height:22px;flex:none}
.hbox b{display:block;font:700 14px/1.15 var(--fd);letter-spacing:.02em}
.hbox small{font-size:11px;opacity:.75}
.dnav button{background:transparent;border:0;color:#fff;width:24px;height:30px;border-radius:5px;display:grid;place-items:center}
.dnav button:hover{background:rgba(255,255,255,.15)}
.dnav input{background:transparent;border:0;color:#fff;font:700 14px var(--fd);color-scheme:dark;width:118px}
.hbtn{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);color:#fff;border-radius:7px;padding:6px 10px;font:600 12px var(--fd);letter-spacing:.04em;display:inline-flex;align-items:center;gap:6px}
.hbtn:hover{background:rgba(255,255,255,.22)}
.hbtn svg{width:14px;height:14px}
.sum{max-width:1720px;margin:10px auto 0;display:flex;gap:8px;flex-wrap:wrap;align-items:stretch}
.notice{max-width:1720px;margin:10px auto 0;background:#FFF7E0;border:1px solid #F1D27A;border-radius:8px;padding:7px 12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:12.5px}
.notice button{margin-left:auto}
.cols{max-width:1720px;margin:10px auto 0;padding-bottom:28px;display:flex;flex-direction:column}
.r2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:start}
.sx{display:flex;flex-direction:column;gap:8px;min-width:0}
.awl{max-width:100%}
.awl .sb{flex-wrap:wrap}
.awl .lb{font:700 12px var(--fd);letter-spacing:.06em;color:var(--navy2)}
.awl label{display:flex;align-items:center;gap:6px;font:700 14px var(--fd)}
.awl input{width:80px;font:700 14px var(--fd)!important}
.col{display:flex;flex-direction:column;min-width:0}
.band{display:flex;align-items:center;gap:12px;color:#fff;position:relative}
.band.M{background:linear-gradient(100deg,var(--malam),#8793A0)}
.band.P{background:linear-gradient(100deg,#F2A900,#FFCB2E);color:#3A2A00}
.band.S{background:linear-gradient(100deg,#E8561D,#F58A3E)}
.band svg{width:34px;height:34px;flex:none}
.band h2{margin:0;font:700 22px/1 var(--fd);letter-spacing:.04em;white-space:nowrap}
.band p{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.band p{margin:1px 0 0;font:600 13px var(--fd);opacity:.9}
.band .live{font:700 10.5px var(--fd);letter-spacing:.08em;background:rgba(255,255,255,.92);color:#0B7A36;border-radius:20px;padding:2px 9px;display:none;align-items:center;gap:5px}
.band .live::before{content:"";width:7px;height:7px;border-radius:50%;background:#16A34A;animation:pulse 1.4s infinite}
.col.now .band .live{display:inline-flex}
@keyframes pulse{50%{opacity:.3}}
.bact{margin-left:auto;display:flex;flex-wrap:wrap;justify-content:flex-end}
.bbtn{border:1px solid rgba(255,255,255,.45);background:rgba(255,255,255,.16);color:inherit;border-radius:6px;padding:4px 8px;font:600 11.5px var(--fd);letter-spacing:.03em;display:inline-flex;gap:5px;align-items:center;white-space:nowrap}
.band.P .bbtn{border-color:rgba(58,42,0,.3);background:rgba(255,255,255,.35)}
.bbtn:hover{background:rgba(255,255,255,.32)}
.bbtn svg{width:13px;height:13px}
.bbtn.sure{background:#fff;color:var(--tsb);border-color:#fff}
.sec{background:var(--card);overflow:hidden;min-width:0}
.sec>h3{margin:0;color:#fff;font:700 13.5px var(--fd);display:flex;align-items:center;gap:8px;text-transform:uppercase}
.sec>h3 svg{width:15px;height:15px}
.sec>h3 .cnt{margin-left:auto;font-size:11.5px;opacity:.8}
.sec>h3 .eqm{display:flex;gap:6px;opacity:1}
.eqsw{display:flex;gap:3px;padding:3px;border-radius:10px;background:rgba(255,255,255,.14);margin-left:14px}
.eqsw button{width:34px;height:26px;border:0;border-radius:7px;background:transparent;color:#fff;display:grid;place-items:center;padding:0;cursor:pointer;transition:.2s}
.eqsw button svg{width:16px;height:16px}
.eqsw button:hover{background:rgba(255,255,255,.22)}
.eqsw button.on{background:rgba(255,255,255,.34)}
.sec>h3 .eqn{margin-left:10px;font:600 11.5px var(--fd);letter-spacing:.04em;opacity:.9;text-transform:none}
.wnt{align-self:center;margin-left:6px;background:#C0392B;color:#fff;border-radius:6px;padding:4px 8px;font:700 11.5px var(--fd);letter-spacing:.03em;white-space:nowrap}
input.f,select.f{border:0;border-bottom:1px solid var(--line);background:transparent;padding:2px 3px;min-width:0;width:100%;outline:none;text-transform:uppercase}
input.f:focus,select.f:focus{border-bottom-color:var(--accent);background:var(--soft)}
input.f::placeholder{color:#A9B5C7;text-transform:none}
input.num{text-align:right;font-weight:600}
.tkg{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:10px}
.kv{display:grid;grid-template-columns:62px minmax(0,1fr);gap:3px 6px;align-items:center;font-size:12px}
.kv label{color:var(--muted);font-weight:600}
.awl input.num{text-align:left}
.sdr{display:flex;align-items:center;margin-bottom:5px;font:700 13px var(--fd);letter-spacing:.03em}
.sdr .n{background:var(--navy2);color:#fff;border-radius:4px;padding:0 7px}
.sdr input{font:600 13px var(--fb)}
.tl{display:flex;flex-direction:column;gap:5px}
.tbx{border:1px solid var(--line);border-radius:6px;background:var(--soft);padding:4px 7px}
.tbx header{display:flex;justify-content:space-between;align-items:center;font:700 11.5px var(--fd);letter-spacing:.04em;color:var(--navy2)}
.tbx header b{font-size:15px;color:var(--ink)}
.tbx ol{margin:1px 0 2px;padding-left:18px;font-weight:600}
.tbx ol li{display:flex;justify-content:space-between;gap:4px}
.tbx .nil{color:var(--muted);text-align:center;margin:1px 0}
.tbx input{font-size:11.5px!important;border-bottom-style:dashed!important}
.tkL{gap:8px}.tkL .tkb{display:flex;flex-direction:column;flex:1;min-width:0}.tkL .tkb .wa{flex:1;min-height:90px}.tbx ol li>span{white-space:pre-line}.tbx ol li+li{margin-top:6px}
.x{border:0;background:transparent;color:#A3AEC0;width:18px;height:18px;border-radius:4px;flex:none;display:grid;place-items:center;font-size:13px;line-height:1}
.x:hover{background:#FDECEA;color:var(--tsb)}
.tot{margin-top:8px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;border:1px solid var(--line);border-radius:6px;padding:5px 8px;background:var(--soft)}
.tot .lb{font:700 11.5px var(--fd);letter-spacing:.05em;color:var(--navy2)}
.tot label{display:flex;align-items:center;gap:4px;font:700 13px var(--fd)}
.tot input{width:72px;font:700 14px var(--fd)!important}
.wx{display:flex;gap:3px;margin-left:auto}
.wx button{border:1px solid var(--line);background:var(--card);border-radius:5px;padding:2px 7px;font:600 11px var(--fd);letter-spacing:.03em;display:flex;align-items:center;gap:4px;color:var(--muted)}
.wx button svg{width:14px;height:14px}
.wx button[aria-pressed="true"]{background:var(--navy2);color:#fff;border-color:var(--navy2)}
.bk{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
.bt{width:100%;border-collapse:collapse}
.bt th{font:700 10.5px var(--fd);letter-spacing:.05em;text-align:left;padding:2px 3px;border-bottom:1px solid var(--line)}
.bt th:last-child{text-align:right}
.bt td{border-bottom:1px solid #EDF2F8}
.bt td:first-child{font:700 12.5px var(--fd);color:var(--navy2);width:26px}
.bt td:last-child{width:46px}
.bt td.lv{position:relative}
.bt .bar{position:absolute;left:2px;right:2px;bottom:1px;height:2px;background:#E4EBF4;border-radius:2px;overflow:hidden}
.bt .bar i{display:block;height:100%;background:var(--accent)}
.bt .bar i.lo{background:var(--tsb)}
.kl{display:flex;flex-direction:column;max-height:260px;overflow:auto}
.kr{display:grid;grid-template-columns:48px minmax(0,1fr) 18px;gap:6px;align-items:start;padding:3px 2px;border-bottom:1px solid #EDF2F8}
.kr time{font:700 12.5px var(--fd);color:var(--navy2)}
.kr p{margin:0;text-transform:uppercase;white-space:pre-wrap;word-break:break-word}
.cl .kr{grid-template-columns:10px minmax(0,1fr) 18px}
.cl .kr::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--accent);margin-top:7px}
.empty{color:var(--muted);text-align:center;padding:8px 0}
.add{display:flex;gap:6px;margin-top:6px;align-items:center}
.add input[type=time]{width:100px;flex:none;text-transform:none}
.abtn{border:0;background:var(--accent);color:#fff;border-radius:5px;padding:4px 10px;font:600 12px var(--fd);letter-spacing:.03em;flex:none}
.abtn:hover{background:#0F55B8}
.lh{font:700 11.5px var(--fd);text-transform:uppercase;color:#fff;display:flex;align-items:center;gap:8px}
.lh .cnt{margin-left:auto;font-size:10px;opacity:.85;letter-spacing:.03em;text-transform:none}
.ltbl{width:100%}
.ltbl th{font:700 9px var(--fd);text-align:center;white-space:nowrap;text-transform:uppercase}
.ltbl td{text-align:center}
.ltbl select.f,.ltbl input.f{min-width:0;text-align:center;border-bottom:1px dashed var(--line)}
.ltbl .empty{padding:10px 0}
.kr.srR,.kr.doneR{grid-template-columns:72px minmax(0,1fr) 18px;border-bottom:0;background:#FFF6D9;border-radius:6px;padding:4px 7px}
.kr.doneR{background:#EEF1F5}
.kr.srR .no,.kr.doneR .no{font:700 11.5px var(--fd);color:#8A5A00}
.kr.doneR .no{color:var(--muted)}
.pg{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px 18px}
.er.h{grid-template-columns:minmax(0,1fr) auto 46px}
.er>span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.er input{font-size:11.5px!important}
.st{border:1px dashed #B9C6D8;background:#fff;color:#9AA7BA;padding:0 6px}
.st.OP{background:var(--op);border:0;color:#fff}
.st.SB{background:#d4edbc;border:0;color:#2F5D1E}
.st.ESB{background:var(--sb);border:0;color:#fff}
.st.TSB{background:var(--tsb);border:0;color:#fff}
.st.PM{background:var(--pm);border:0;color:#fff}
.legend{display:flex;flex-wrap:wrap;font-size:11px;color:var(--muted);align-items:center}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:3px;vertical-align:-1px}
.ds{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:8px}
.mdl{position:fixed;inset:0;background:rgba(11,39,82,.45);display:grid;place-items:center;z-index:50;padding:16px}
.mdl>div{background:var(--card);border-radius:10px;width:min(560px,100%);padding:14px;display:flex;flex-direction:column;gap:8px;max-height:90vh}
.mdl h4{margin:0;font:700 16px var(--fd);letter-spacing:.03em;color:var(--navy2)}
.mdl textarea{width:100%;min-height:300px;border:1px solid var(--line);border-radius:6px;padding:8px;font:12px/1.5 ui-monospace,Consolas,monospace;resize:vertical}
.mdl .row{display:flex;gap:8px;justify-content:flex-end;align-items:center}
.mdl .row span{margin-right:auto;font-size:12px;color:var(--op);font-weight:600}
.gbtn{border:1px solid var(--line);background:var(--card);border-radius:6px;padding:6px 12px;font:600 12.5px var(--fd)}
.saved{font:600 11px var(--fd);letter-spacing:.04em;opacity:.8}
@media (max-width:1000px){.r2{grid-template-columns:minmax(0,1fr)}}
@media (max-width:560px){.brand{border:0;padding:0}
.tkg,.bk{grid-template-columns:minmax(0,1fr)}
.hr{margin-left:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
:root{--oh:#475569}
.st.OH{background:var(--oh);border:0;color:#fff}
.sec{border:1px solid #D2DDEB;box-shadow:0 1px 1px rgba(11,39,82,.04),0 16px 30px -20px rgba(11,39,82,.38)}
.sec>h3{padding:7px 12px;letter-spacing:.08em}
.sec>h3 svg{box-sizing:content-box;padding:3px;border-radius:6px}
.lh{padding:7px 12px;font-size:12.5px;letter-spacing:.08em}
.band{border-radius:12px;padding:13px 18px;overflow:hidden}
.band::after{content:"";position:absolute;right:-30px;top:-70px;width:280px;height:280px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.26),transparent 66%);pointer-events:none}
.band>*{position:relative;z-index:1}
.band h2{font-size:27px}
.band p{font-size:13.5px}
.eqc{display:flex;flex-direction:column}
.eg{display:flex;flex-direction:column;gap:1px}
.gh{display:flex;align-items:center;gap:10px;font:700 11px var(--fd);text-transform:uppercase;color:var(--navy2)}
.gh::before{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,#BFCDE0)}
.gh::after{content:"";flex:1;height:1px;background:linear-gradient(270deg,transparent,#BFCDE0)}
.er{display:grid;align-items:center;border-radius:6px}
.er:hover{background:#EFF5FC}
.er.eh{min-height:0;padding-top:0;font:700 10px var(--fd);letter-spacing:.1em;color:var(--muted)}
.er.eh:hover{background:none}
.er .lab{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.er .un{font-size:11px;color:var(--muted)}
.er input.f{width:100%;background:#F3F7FC;border:1px solid #E0E8F3;border-radius:6px;padding:0 7px;text-transform:none}
.er input.f:focus{background:#fff;border-color:var(--accent);box-shadow:0 0 0 3px rgba(22,103,217,.14)}
.er input.nt{border-color:transparent}
.er input.nt::placeholder{color:#C9D3E0;font-style:normal}
.gap{height:8px}
.st{border-radius:11px;font:700 10.5px var(--fd);letter-spacing:.06em;box-shadow:inset 0 -1px 0 rgba(0,0,0,.12)}
.st:hover{filter:brightness(1.07)}
.legend{border-top:1px dashed var(--line)}
.sdr{gap:6px}
.sdr input.cn{width:34px;border:0;border-bottom:1px solid var(--line);font:700 14px var(--fd)!important;text-align:left;padding:0 2px}
.wa{display:block;width:100%;min-height:196px;resize:vertical;border:1px solid #D2DDEB;border-radius:8px;background:#fff;padding:10px 12px;color:var(--ink);outline:none;margin-top:4px}
.wa:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(22,103,217,.14)}
.r3{display:grid;align-items:stretch}
.r3>div{display:flex;min-width:0}
.r3>div>.sec{flex:1;min-width:0;display:flex;flex-direction:column}
.r3 .sec>.sb{flex:1;display:flex;flex-direction:column;min-height:0}
.g-l1{grid-column:1;grid-row:1}
.g-l2{grid-column:1;grid-row:2}
.g-u1{grid-column:1;grid-row:3}
.g-u2{grid-column:1;grid-row:4}
.g-cat{grid-column:2;grid-row:1/3}
.tw{overflow-x:auto;flex:none}
.ltbl{border-collapse:separate;font-size:11px}
.ltbl th{border-bottom:0}
.ltbl td{border-bottom:0}
.ltbl select.f,.ltbl input.f{background:#F3F7FC;border:1px solid #E0E8F3;border-radius:6px;padding:0 4px;color:var(--ink)}
.ltbl select.f.e{color:#9AA7BA}
.ltbl input[type=time]{font-family:var(--fb)}
.ltbl select.f:hover,.ltbl input.f:hover{border-color:#B9CCE3}
.ltbl select.f:focus,.ltbl input.f:focus{background:#fff;border-color:var(--accent);box-shadow:0 0 0 3px rgba(22,103,217,.14)}
.r3 .add{margin-top:8px}
.kr.srR,.kr.doneR{margin-bottom:5px}
@media (max-width:1100px){.eq{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:1000px){.r3{grid-template-columns:minmax(0,1fr)}
.g-l1,.g-l2,.g-u1,.g-u2,.g-cat{grid-column:1;grid-row:auto}
.r3 .kl{flex:none;max-height:300px}}
@media (max-width:700px){.eq{grid-template-columns:minmax(0,1fr)}}
@media (max-width:600px){.band{flex-wrap:wrap;gap:8px;padding:12px 14px}
.band h2{font-size:22px}
.bact{margin-left:0}}
:root{--ink:#0E1E36;--muted:#53657F;--line:#C9D6E6}
body{font:500 13.5px/1.45 var(--fb)}
.sec>h3{font-size:13.5px}
.sec>h3 .cnt{font-weight:600;text-transform:none;letter-spacing:.02em}
.sb{padding:9px 11px}
input.f,select.f{font-size:13px;font-weight:600}
.eq{display:grid;padding:0}
.eqc{min-width:0}
.eg{--lw:118px}
.eg.lg{--lw:134px}
.eg.nw{--nw:206px}
.eg.sm{--lw:72px}
.gh{font-size:11px;letter-spacing:.15em;margin-bottom:5px}
.er{grid-template-columns:var(--lw) 48px;gap:8px;padding:2px 6px;min-height:26px;font-size:12.5px;font-weight:700}
.er+.er{box-shadow:inset 0 1px 0 #F1F5FA}
.er.md{grid-template-columns:var(--lw) 48px 112px}
.er.lv{grid-template-columns:var(--lw) 74px 24px}

@media (max-width:760px){.eq{grid-template-columns:minmax(0,1fr);justify-content:stretch}
.er.hm{grid-template-columns:var(--lw) 46px 54px minmax(0,1fr)}
.er.nt2,.er.md{grid-template-columns:var(--lw) 46px minmax(0,1fr)}
.er.md2{grid-template-columns:var(--lw) minmax(0,1fr)}}
.er .lab{font-weight:700;color:var(--ink)}
.er .un{font-weight:600}
.er input.f{height:23px;font-size:12px;font-weight:600}
.er input.num{text-align:center;font-weight:700}
.er input.nt{font-size:11.5px}
.st{min-width:46px;height:21px;font-size:10.5px}
.legend{margin-top:10px;padding-top:8px;gap:14px;font-weight:600}
.pls{display:flex;flex-direction:column;gap:10px}
.pl{border:1px solid #D4DFEC;border-radius:8px;overflow:hidden;background:#fff}
.plh{display:flex;align-items:center;gap:9px;color:#fff;font:700 12px var(--fd);letter-spacing:.11em;padding:5px 10px}
.plh::before{content:"";width:9px;height:9px;border-radius:2px;background:#fff;opacity:.9;flex:none}
.plh b{margin-left:auto;background:#FFE24D;color:#3A2A00;border-radius:4px;padding:0 10px;font:700 13px var(--fd);letter-spacing:.02em}
.plb{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.plb>table+table{border-left:2px solid #D4DFEC}
.plt{width:100%;border-collapse:collapse;table-layout:fixed}
.plt th{background:linear-gradient(180deg,#255AAE,#1F4E9C);color:#fff;font:700 9.5px var(--fd);text-transform:uppercase;border-right:1px solid rgba(255,255,255,.2)}
.plt th.c{text-align:center}
