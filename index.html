<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="color-scheme" content="light">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Brandals — UP Tanjung Awar-Awar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light;
  --bg:#ECF0F4; --ink:#1F2733; --muted:#7A8594;
  --sd:rgba(163,177,198,.65); --sl:rgba(255,255,255,.95);
  --accent:#0072FF; --accent2:#00C6FF; --glow:rgba(0,114,255,.35);
  --raise:8px 8px 16px var(--sd),-8px -8px 16px var(--sl);
  --raise-sm:4px 4px 8px var(--sd),-4px -4px 8px var(--sl);
  --inset:inset 4px 4px 8px var(--sd),inset -4px -4px 8px var(--sl);
  --f:"Poppins","Segoe UI",system-ui,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font:14px/1.5 var(--f);-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:4px;border-radius:16px}
.wrap{max-width:1240px;margin:0 auto;padding:28px clamp(16px,4vw,40px) 48px}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:nowrap;margin-bottom:34px}
@media (max-width:980px){.top{flex-wrap:wrap}.brand h1{white-space:normal}}
.brand{display:flex;align-items:center;gap:22px;min-width:0}
.brand img{height:50px;width:auto;flex:none}
.brand .vd{width:2px;height:54px;border-radius:2px;background:linear-gradient(var(--sd),transparent);box-shadow:1px 0 0 var(--sl);flex:none}
.brand h1{margin:0;white-space:nowrap;font-size:clamp(15px,1.55vw,21px);font-weight:700;line-height:1.25;letter-spacing:-.01em;background:linear-gradient(90deg,#0072FF,#00B4FF 60%,#3A7BFF);-webkit-background-clip:text;background-clip:text;color:transparent}
.brand p{margin:6px 0 0;font-weight:600;font-size:13.5px;letter-spacing:.22em;color:#111827}
.clock{padding:12px 22px;border-radius:20px;box-shadow:var(--inset);text-align:right;flex:none}
.clock b{display:block;font-size:26px;font-weight:600;line-height:1.1;color:var(--accent)}
.clock span{font-size:12.5px;color:var(--muted)}

/* menu */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:26px}
@media (max-width:900px){.grid{grid-template-columns:1fr 1fr}}
@media (max-width:560px){.grid{grid-template-columns:1fr}}
.tile{position:relative;display:flex;flex-direction:column;justify-content:space-between;gap:26px;min-height:190px;padding:24px;border-radius:26px;background:var(--bg);box-shadow:var(--raise);cursor:pointer;transition:transform .35s ease,box-shadow .35s ease;outline:none}
.tile:hover,.tile:focus-visible{transform:translateY(-6px);box-shadow:12px 12px 26px var(--sd),-10px -10px 22px var(--sl)}
.tile:active{transform:translateY(-2px) scale(.985);box-shadow:var(--inset)}
.ic{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;box-shadow:var(--raise-sm);color:var(--c,var(--accent));transition:.5s ease}
.ic svg{width:30px;height:30px}
.tile:hover .ic,.tile:focus-visible .ic,.sub:hover .ic,.sub:focus-visible .ic{background:var(--c,var(--accent));color:#fff;transform:rotate(360deg) scale(1.06);box-shadow:0 10px 24px color-mix(in srgb,var(--c,var(--accent)) 40%,transparent)}
.tile h2{margin:0;font-size:18px;font-weight:700;line-height:1.3}
.go{position:absolute;top:24px;right:24px;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;box-shadow:var(--inset);color:var(--muted);transition:.35s}
.go svg{width:16px;height:16px}
.tile:hover .go,.tile:focus-visible .go{color:#fff;background:linear-gradient(135deg,var(--accent2),var(--accent));box-shadow:0 6px 16px var(--glow);transform:translateX(3px)}

/* early warning: panel lebar dengan 4 area */
.ews{grid-column:1/-1;padding:24px;border-radius:26px;box-shadow:var(--raise)}
.ews .hd{position:relative;display:flex;align-items:center;gap:18px;margin:-10px -10px 12px;padding:10px 64px 10px 10px;border-radius:20px;cursor:pointer;outline:none;transition:.3s}
.ews .hd .go{top:50%;right:10px;margin-top:-19px}
.ews .hd:hover,.ews .hd:focus-visible{box-shadow:var(--raise-sm)}
.ews .hd:hover .go,.ews .hd:focus-visible .go{color:#fff;background:linear-gradient(135deg,var(--accent2),var(--accent));box-shadow:0 6px 16px var(--glow);transform:translateX(3px)}
.ews .hd:active{box-shadow:var(--inset)}
.ews .hd h2{margin:0;font-size:18px;font-weight:700}
.ews .hd .ic{--c:#E5484D}
.ews:hover .hd .ic{background:#E5484D;color:#fff;transform:rotate(360deg);box-shadow:0 10px 24px rgba(229,72,77,.35)}
.areas{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;padding:18px;border-radius:22px;box-shadow:var(--inset)}
@media (max-width:900px){.areas{grid-template-columns:1fr 1fr}}
.sub{display:flex;align-items:center;gap:14px;padding:16px;border-radius:18px;background:var(--bg);box-shadow:var(--raise-sm);cursor:pointer;transition:transform .3s ease,box-shadow .3s ease;outline:none;min-width:0}
.sub .ic{width:50px;height:50px;flex:none}
.sub .ic svg{width:24px;height:24px}
.sub b{font-size:14.5px;font-weight:600;line-height:1.3}
.sub:hover,.sub:focus-visible{transform:translateY(-4px);box-shadow:var(--raise)}
.sub:active{transform:scale(.97);box-shadow:var(--inset)}

.foot{margin-top:40px;text-align:center;color:var(--muted);font-size:12px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(10px);opacity:0;pointer-events:none;padding:11px 22px;border-radius:14px;background:linear-gradient(135deg,var(--accent2),var(--accent));color:#fff;font-weight:600;font-size:13px;box-shadow:0 8px 22px var(--glow);transition:.25s;z-index:10}
.toast.on{opacity:1;transform:translateX(-50%)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

<script>
/* Alamat halaman tiap menu. Isi nama file-nya setelah file diunggah ke GitHub, contoh: 'ews-turbin.html' */
const LINKS = {
  ews:       '',
  efisiensi: '',
  operation: '',
  operator:  '',
  turbin:    '',
  boiler:    '',
  wtp:       '',
  cah:       'PKU_Coal_Handling.html'
};

document.querySelectorAll('[data-key]').forEach(el=>{
  const url = LINKS[el.dataset.key];
  if(url){ el.href = url; }
  else {
    el.setAttribute('role','button'); el.tabIndex = 0;
    const soon = e=>{ e.preventDefault(); const t=document.getElementById('toast'); t.textContent='Halaman belum tersedia'; t.classList.add('on'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('on'),1800); };
    el.addEventListener('click',soon);
    el.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' ') soon(e); });
  }
});

const H=['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'], B=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
function tick(){ const n=new Date(), p=v=>String(v).padStart(2,'0');
  document.getElementById('t').textContent=`${p(n.getHours())}:${p(n.getMinutes())}`;
  document.getElementById('d').textContent=`${H[n.getDay()]}, ${n.getDate()} ${B[n.getMonth()]} ${n.getFullYear()}`; }
tick(); setInterval(tick,30e3);
</script>
